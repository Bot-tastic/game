<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Demolition Run</title>
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../../shared/components.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body class="game-page">
  <canvas id="game"></canvas>

  <header class="hud safe-area">
    <a class="hud-back" href="../../index.html">&larr; Games</a>
    <div class="hud-scores">
      <div class="hud-score">
        <span class="label">Score</span>
        <span class="value" id="score-value">0</span>
      </div>
      <div class="hud-score">
        <span class="label">Best</span>
        <span class="value" id="best-value">0</span>
      </div>
      <div class="hud-score">
        <span class="label">Dist</span>
        <span class="value" id="dist-value">0</span>
      </div>
    </div>
  </header>

  <div class="damage-meter" aria-label="Damage" id="damage-meter-slot">
    <div class="damage-meter-fill" id="damage-fill"></div>
  </div>

  <section class="overlay" id="menu-overlay">
    <h1>Demolition Run</h1>
    <p class="stat">Drag anywhere to steer. Hold BRAKE to slow down. Smash everything &mdash; don't total your car.</p>
    <div class="actions">
      <button class="btn btn--primary" id="start-btn">Start</button>
    </div>
  </section>

  <section class="overlay" id="gameover-overlay" hidden>
    <h2>Wrecked</h2>
    <p class="stat">Score <strong id="final-score">0</strong></p>
    <p class="stat">Distance <strong id="final-distance">0</strong></p>
    <p class="stat">Best <strong id="final-best">0</strong></p>
    <div class="actions">
      <button class="btn btn--primary" id="retry-btn">Retry</button>
    </div>
  </section>

  <button class="btn btn--ghost" id="brake-btn">BRAKE</button>

  <script type="module" src="./main.js"></script>
</body>
</html>
