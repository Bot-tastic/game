<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>2048</title>
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../../shared/components.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="game-page">
  <header class="hud safe-area">
    <a class="hud-back" href="../../index.html">&larr; Games</a>
    <div class="hud-scores">
      <div class="hud-score">
        <span class="label">Score</span>
        <span class="value" id="score-value">0</span>
      </div>
      <div class="hud-score">
        <span class="label">Best</span>
        <span class="value" id="best-value">0</span>
      </div>
    </div>
  </header>

  <main class="game-main safe-area">
    <button class="btn btn--primary new-game-btn" id="new-game-btn">New Game</button>
    <div id="board" class="board">
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <div class="overlay" id="win-overlay" hidden>
    <h2>You reached 2048!</h2>
    <div class="actions">
      <button class="btn btn--primary" id="keep-going-btn">Keep Going</button>
      <button class="btn btn--ghost" id="win-new-game-btn">New Game</button>
    </div>
  </div>

  <div class="overlay" id="gameover-overlay" hidden>
    <h2>No more moves</h2>
    <p class="stat">Score<br /><strong id="gameover-score">0</strong></p>
    <p class="stat">Best<br /><strong id="gameover-best">0</strong></p>
    <div class="actions">
      <button class="btn btn--primary" id="gameover-new-game-btn">New Game</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
