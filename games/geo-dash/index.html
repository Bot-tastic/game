<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Geo Dash</title>
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../../shared/components.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="game-page">
  <canvas id="game"></canvas>

  <header class="hud safe-area">
    <a class="hud-back" href="../../index.html">&larr; Games</a>
    <div class="hud-scores">
      <div class="hud-score">
        <span class="label">Progress</span>
        <span class="value" id="progress-value">0%</span>
      </div>
      <div class="hud-score">
        <span class="label">Mode</span>
        <span class="value" id="mode-value">—</span>
      </div>
      <div class="hud-score">
        <span class="label">Try</span>
        <span class="value" id="attempt-value">0</span>
      </div>
    </div>
  </header>

  <div id="mode-hint" class="mode-hint" hidden></div>

  <section class="overlay" id="levelselect-overlay">
    <h2>Geo Dash</h2>
    <p class="subtitle">Tap/hold to control. Reach the end without crashing.</p>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <section class="overlay" id="gameover-overlay" hidden>
    <h2>Crashed!</h2>
    <p class="stat">Progress <strong id="final-progress">0%</strong></p>
    <p class="stat">Best <strong id="final-best">0%</strong></p>
    <p class="stat">Attempt <strong id="final-attempt">0</strong></p>
    <div class="actions">
      <button class="btn btn--primary" id="retry-btn">Retry</button>
      <button class="btn btn--ghost" id="back-btn">Levels</button>
    </div>
  </section>

  <section class="overlay" id="win-overlay" hidden>
    <h2>Level Complete!</h2>
    <p class="stat">Attempts <strong id="win-attempts">0</strong></p>
    <div class="actions">
      <button class="btn btn--primary" id="next-btn">Next Level</button>
      <button class="btn btn--ghost" id="win-back-btn">Levels</button>
    </div>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
