<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Geo Dash</title>
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../../shared/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="game-page">
  <canvas id="game"></canvas>

  <header class="hud safe-area" id="hud">
    <a class="hud-back" href="../../index.html">&larr; Games</a>
    <div class="hud-right">
      <div class="hud-chip" id="attempt-chip"><span class="k">Attempt</span><span class="v" id="attempt-value">1</span></div>
      <div class="hud-chip" id="coin-chip"><span class="k">Coins</span><span class="v" id="coin-value">0</span></div>
      <button class="icon-btn" id="pause-btn" aria-label="Pause">II</button>
    </div>
  </header>

  <div class="progress-wrap" id="progress-wrap" hidden>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-best" id="progress-best"></div>
    </div>
    <div class="progress-num" id="progress-num">0%</div>
  </div>

  <div class="mode-tag" id="mode-tag" hidden></div>
  <div class="toast" id="toast"></div>

  <!-- Level select ------------------------------------------------------ -->
  <section class="overlay overlay--menu" id="menu-overlay">
    <div class="menu-head">
      <h1 class="logo">GEO<span>DASH</span></h1>
      <p class="tagline">Tap in time. Don't blink.</p>
      <button class="icon-btn icon-btn--lg" id="mute-btn" aria-label="Toggle sound">♪</button>
    </div>
    <div class="level-grid" id="level-grid"></div>
    <p class="hint">Tap or press <kbd>Space</kbd> to jump · hold in ship &amp; wave</p>
  </section>

  <!-- Level detail ------------------------------------------------------ -->
  <section class="overlay overlay--sheet" id="detail-overlay" hidden>
    <div class="sheet" id="detail-sheet">
      <div class="sheet-head">
        <span class="diff-pill" id="detail-diff">Easy</span>
        <h2 id="detail-name">Level</h2>
        <div class="stars" id="detail-stars"></div>
      </div>
      <div class="sheet-stats">
        <div><span class="k">Best</span><span class="v" id="detail-best">0%</span></div>
        <div><span class="k">Attempts</span><span class="v" id="detail-attempts">0</span></div>
        <div><span class="k">Coins</span><span class="v" id="detail-coins">0</span></div>
      </div>
      <div class="actions">
        <button class="btn btn--primary" id="play-btn">Play</button>
        <button class="btn btn--practice" id="practice-btn">Practice</button>
      </div>
      <button class="btn btn--ghost" id="detail-back">Back</button>
    </div>
  </section>

  <!-- Pause ------------------------------------------------------------- -->
  <section class="overlay overlay--sheet" id="pause-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h2 id="pause-name">Paused</h2></div>
      <div class="sheet-stats">
        <div><span class="k">Progress</span><span class="v" id="pause-progress">0%</span></div>
        <div><span class="k">Best</span><span class="v" id="pause-best">0%</span></div>
        <div><span class="k">Attempts</span><span class="v" id="pause-attempts">0</span></div>
      </div>
      <div class="actions">
        <button class="btn btn--primary" id="resume-btn">Resume</button>
        <button class="btn btn--ghost" id="restart-btn">Restart</button>
      </div>
      <div class="actions">
        <button class="btn btn--practice" id="toggle-practice-btn">Practice: Off</button>
        <button class="btn btn--ghost" id="quit-btn">Levels</button>
      </div>
    </div>
  </section>

  <!-- Win --------------------------------------------------------------- -->
  <section class="overlay overlay--sheet" id="win-overlay" hidden>
    <div class="sheet sheet--win">
      <div class="sheet-head"><h2 class="win-title">LEVEL COMPLETE</h2></div>
      <div class="sheet-stats">
        <div><span class="k">Attempts</span><span class="v" id="win-attempts">0</span></div>
        <div><span class="k">Coins</span><span class="v" id="win-coins">0</span></div>
        <div><span class="k">Mode</span><span class="v" id="win-mode">Normal</span></div>
      </div>
      <div class="actions">
        <button class="btn btn--primary" id="next-btn">Next Level</button>
        <button class="btn btn--ghost" id="win-back-btn">Levels</button>
      </div>
    </div>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
