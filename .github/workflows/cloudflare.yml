name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

# Everything sensitive comes from repository secrets (Settings → Secrets and
# variables → Actions), never from files in the repo:
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   SSH_RELAY_TOKEN        optional; pushed to the Worker as its TOKEN secret
#   SSH_RELAY_ALLOW        optional; pushed to the Worker as its ALLOW secret
# Without the first two, the deploy is skipped.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SSH_RELAY_TOKEN: ${{ secrets.SSH_RELAY_TOKEN }}
  SSH_RELAY_ALLOW: ${{ secrets.SSH_RELAY_ALLOW }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wrangler
        run: npm ci

      - name: Check config
        run: npm run check

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy

      - name: Set SSH relay TOKEN
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SSH_RELAY_TOKEN != ''
        run: printf '%s' "$SSH_RELAY_TOKEN" | npx wrangler secret put TOKEN

      - name: Set SSH relay ALLOW
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SSH_RELAY_ALLOW != ''
        run: printf '%s' "$SSH_RELAY_ALLOW" | npx wrangler secret put ALLOW
