# /etc/nginx/sites-available/game-hub
# Replace games.example.com with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/game-hub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d games.example.com
# Certbot adds the HTTPS server block and the HTTP -> HTTPS redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name games.example.com;

    # The deployed repository. Games are plain static files.
    root /var/www/game-hub;
    index index.html;

    # Never serve the backend's source, dependencies or dotfiles.
    location ^~ /server/ { return 404; }
    location ~ /\.       { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Game code changes with every deploy; let browsers revalidate rather than
    # cache stale modules for a day.
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:png|jpg|svg|webp|woff2?|mp3|ogg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    try_files $uri $uri/ =404;
}
